name: Deploy to Prod

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".vscode/**"
      - ".prettierignore"
      - ".prettierrc"
      - "components.json"

  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".vscode/**"
      - ".prettierignore"
      - ".prettierrc"
      - "components.json"

env:
  NODE_VERSION: 24.16.0

jobs:
  ci:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Cache Bun global cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security audit
        run: bun audit --audit-level=high || true

      - name: Lint
        run: bun run lint:check

      - name: Build
        run: bun run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Show bundle size
        run: du -sh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 2
